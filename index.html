<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <title>Sổ Chấm Công &amp; Giờ Làm</title>
  <style>
    :root {
      --bg: #eef0f2;
      --surface: #ffffff;
      --header-bg: #2f3337;
      --header-text: #ffffff;
      --ink: #1f2429;
      --muted: #626a73;
      --line: #dce1e7;
      --accent: #353b41;
      --accent-hover: #1b1f23;
      --x2-bg: #fff3cd;
      --x2-ink: #7a5200;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-right: max(12px, env(safe-area-inset-right));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      -webkit-text-size-adjust: 100%;
    }
    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }
    .top-banner {
      background: var(--header-bg);
      color: var(--header-text);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .top-row {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .icon-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.07);
    }
    .top-banner h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .banner-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .panel {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.03);
      overflow: hidden;
    }
    .panel-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0 0 11px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
    }
    .form-grid > div {
      min-width: 0;
      max-width: 100%;
    }
    .full-span {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 5px;
    }
    /* Cỡ chữ >= 16px giúp iPhone 15 Pro không tự zoom khi chạm nhập liệu */
    input, select, button {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 42px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font-size: 1rem;
      background: #fff;
      color: var(--ink);
    }
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      padding: 9px 8px;
      font-size: 0.9rem;
      line-height: 1.2;
      white-space: nowrap;
    }
    input[type="time"],
    input[type="month"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
    .banner-actions input,
    .banner-actions button {
      min-height: 38px;
      padding: 7px 11px;
      font-size: 0.9rem;
    }
    .banner-actions button {
      width: auto;
    }
    .check-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8f9fa;
      min-height: 42px;
    }
    .check-box input[type="checkbox"] {
      display: inline-block;
      width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      flex-shrink: 0;
      margin: 0;
    }
    .check-box label {
      margin: 0;
      font-size: 0.9rem;
      color: var(--ink);
      cursor: pointer;
    }
    button {
      cursor: pointer;
      font-weight: 600;
    }
    .btn-dark {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      min-height: 44px;
      font-size: 0.98rem;
    }
    .btn-dark:hover { background: var(--accent-hover); }
    .btn-light {
      background: #fff;
      color: var(--ink);
      width: auto;
    }
    .btn-sm {
      min-height: 34px;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      width: auto;
    }
    .btn-del {
      background: #fff;
      color: var(--danger);
      border-color: #fecaca;
      min-height: 32px;
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 7px;
      width: auto;
    }
    .collapsible-body {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .collapsible-body.open {
      display: block;
    }
    .rates-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .holiday-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }
    .holiday-row .holiday-label {
      grid-column: 1 / -1;
      margin: 0;
    }
    .holiday-row input[type="date"] {
      min-height: 38px;
      font-size: 0.92rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--x2-bg);
      color: var(--x2-ink);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .chip button {
      border: none;
      background: none;
      color: var(--x2-ink);
      min-height: auto;
      padding: 0;
      width: auto;
      font-size: 0.95rem;
      line-height: 1;
    }
    .controls-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls-inline select {
      min-height: 34px;
      padding: 5px 8px;
      font-size: 0.84rem;
      border-radius: 8px;
      width: auto;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f5f7f9;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #eceff2;
      color: #212529;
    }
    .tag-x2 {
      background: var(--x2-bg);
      color: var(--x2-ink);
    }
    .sum-row td {
      font-weight: 700;
      background: #f8f9fa;
    }
    .muted {
      color: var(--muted);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-banner">
      <div class="top-row">
        <div class="icon-badge" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
        </div>
        <h1>Sổ Chấm Công Cá Nhân</h1>
      </div>
      <div class="banner-actions">
        <input type="month" id="monthSelect" />
        <button type="button" id="exportCsvBtn" class="btn-light">Xuất CSV</button>
      </div>
    </div>

    <!-- 1. NHẬP CA LÀM VIỆC -->
    <div class="panel">
      <div class="panel-title">
        <span>Nhập ca làm việc</span>
        <button type="button" id="toggleSettingsBtn" class="btn-light btn-sm">Đơn giá &amp; Ngày lễ</button>
      </div>
      <form id="shiftForm" class="form-grid">
        <div>
          <label for="shiftDate">Ngày</label>
          <input type="date" id="shiftDate" required />
        </div>
        <div>
          <label for="shiftJob">Loại công việc</label>
          <select id="shiftJob" required>
            <option value="Dạy">Dạy</option>
            <option value="Phụ đạo">Phụ đạo</option>
            <option value="Nghe">Nghe</option>
            <option value="Kiểm tra">Kiểm tra</option>
            <option value="Trực">Trực</option>
          </select>
        </div>
        <div>
          <label for="startHour">Bắt đầu</label>
          <input type="time" id="startHour" value="08:00" required />
        </div>
        <div>
          <label for="endHour">Kết thúc</label>
          <input type="time" id="endHour" value="10:00" required />
        </div>
        <div class="full-span">
          <div class="check-box">
            <input type="checkbox" id="markHoliday" />
            <label for="markHoliday">Ngày lễ (tự động nhân đôi số giờ x2)</label>
          </div>
        </div>
        <div class="full-span">
          <button type="submit" class="btn-dark">+ Lưu ca</button>
        </div>
      </form>

      <!-- MỤC ÍT DÙNG ĐƯỢC ẨN MẶC ĐỊNH -->
      <div id="extraSettingsBox" class="collapsible-body">
        <label style="margin-bottom:8px;">Đơn giá theo giờ (VNĐ / giờ)</label>
        <div class="rates-grid">
          <div>
            <label for="r_Dạy">Dạy</label>
            <input type="number" id="r_Dạy" min="0" step="1000" />
          </div>
          <div>
            <label for="r_Phụ đạo">Phụ đạo</label>
            <input type="number" id="r_Phụ đạo" min="0" step="1000" />
          </div>
          <div>
            <label for="r_Nghe">Nghe</label>
            <input type="number" id="r_Nghe" min="0" step="1000" />
          </div>
          <div>
            <label for="r_Kiểm tra">Kiểm tra</label>
            <input type="number" id="r_Kiểm tra" min="0" step="1000" />
          </div>
          <div>
            <label for="r_Trực">Trực</label>
            <input type="number" id="r_Trực" min="0" step="1000" />
          </div>
        </div>

        <div class="holiday-row">
          <label for="newHolidayDate" class="muted holiday-label">Thêm ngày lễ (tự động x2 giờ):</label>
          <input type="date" id="newHolidayDate" />
          <button type="button" id="addHolidayBtn" class="btn-light btn-sm">+ Thêm</button>
        </div>
        <div id="holidayChips" class="chips"></div>
      </div>
    </div>

    <!-- 2. DANH SÁCH CA ĐÃ NHẬP -->
    <div class="panel">
      <div class="panel-title">
        <span>Danh sách ca</span>
        <div class="controls-inline">
          <select id="filterJob">
            <option value="ALL">Tất cả 5 loại</option>
            <option value="Dạy">Dạy</option>
            <option value="Phụ đạo">Phụ đạo</option>
            <option value="Nghe">Nghe</option>
            <option value="Kiểm tra">Kiểm tra</option>
            <option value="Trực">Trực</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Thứ</th>
              <th>Công việc</th>
              <th>Khung giờ</th>
              <th>Số giờ</th>
              <th>Thành tiền</th>
              <th>Xóa</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 3. TỔNG KẾT CUỐI TUẦN -->
    <div class="panel">
      <div class="panel-title">
        <span>Tổng kết cuối tuần</span>
        <div class="controls-inline">
          <select id="weekSelect"></select>
        </div>
      </div>
      <div class="muted" id="weekDesc" style="margin-bottom:8px;"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Loại công việc</th>
              <th>Số giờ trong tuần</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody id="weekSummaryBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 4. TỔNG KẾT CUỐI THÁNG -->
    <div class="panel">
      <div class="panel-title">
        <span>Tổng kết cuối tháng</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Loại công việc</th>
              <th>Tổng giờ tháng</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody id="monthSummaryBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const JOBS = ["Dạy", "Phụ đạo", "Nghe", "Kiểm tra", "Trực"];
    const KEY_SHIFTS = "so_cham_cong_shifts_v1";
    const KEY_RATES = "so_cham_cong_rates_v1";
    const KEY_HOLIDAYS = "so_cham_cong_holidays_v1";

    let shifts = JSON.parse(localStorage.getItem(KEY_SHIFTS) || "[]");
    let rates = Object.assign({ "Dạy": 0, "Phụ đạo": 0, "Nghe": 0, "Kiểm tra": 0, "Trực": 0 }, JSON.parse(localStorage.getItem(KEY_RATES) || "{}"));
    let holidays = new Set(JSON.parse(localStorage.getItem(KEY_HOLIDAYS) || "[]"));

    const shiftDateEl = document.getElementById("shiftDate");
    const shiftJobEl = document.getElementById("shiftJob");
    const startHourEl = document.getElementById("startHour");
    const endHourEl = document.getElementById("endHour");
    const markHolidayEl = document.getElementById("markHoliday");
    const newHolidayDateEl = document.getElementById("newHolidayDate");
    const monthSelectEl = document.getElementById("monthSelect");
    const weekSelectEl = document.getElementById("weekSelect");
    const filterJobEl = document.getElementById("filterJob");
    const extraSettingsBoxEl = document.getElementById("extraSettingsBox");

    const today = new Date().toISOString().slice(0, 10);
    shiftDateEl.value = today;
    newHolidayDateEl.value = today;
    monthSelectEl.value = today.slice(0, 7);

    document.getElementById("toggleSettingsBtn").addEventListener("click", () => {
      extraSettingsBoxEl.classList.toggle("open");
    });

    JOBS.forEach(job => {
      const el = document.getElementById("r_" + job);
      el.value = rates[job] || 0;
      el.addEventListener("change", () => {
        rates[job] = Math.max(0, Number(el.value) || 0);
        localStorage.setItem(KEY_RATES, JSON.stringify(rates));
        renderAll();
      });
    });

    function hoursBetween(s, e) {
      const [sh, sm] = s.split(":").map(Number);
      const [eh, em] = e.split(":").map(Number);
      let mins = (eh * 60 + em) - (sh * 60 + sm);
      if (mins <= 0) mins += 1440;
      return Math.round((mins / 60) * 100) / 100;
    }

    function dayIdx(dStr) {
      const [y, m, d] = dStr.split("-").map(Number);
      return new Date(y, m - 1, d).getDay(); // 0 = CN, 6 = T7
    }

    function dayName(dStr) {
      return ["CN", "T2", "T3", "T4", "T5", "T6", "T7"][dayIdx(dStr)];
    }

    // Chỉ Chủ Nhật (0) hoặc Ngày lễ mới x2; Thứ Bảy (6) tính x1
    function hasX2(dStr, flagged = false) {
      return dayIdx(dStr) === 0 || holidays.has(dStr) || Boolean(flagged);
    }

    // Số giờ đã nhân đôi nếu là Chủ Nhật hoặc Ngày lễ
    function effectiveHours(s) {
      const mult = hasX2(s.date, s.holiday) ? 2 : 1;
      return Math.round(s.hours * mult * 100) / 100;
    }

    function mondayOf(dStr) {
      const [y, m, d] = dStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      const diff = dt.getDay() === 0 ? -6 : 1 - dt.getDay();
      dt.setDate(dt.getDate() + diff);
      return dt.toISOString().slice(0, 10);
    }

    function addDays(dStr, n) {
      const [y, m, d] = dStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d + n);
      return dt.toISOString().slice(0, 10);
    }

    function fmtH(h) {
      return Number(h.toFixed(2)).toString() + " giờ";
    }

    function fmtVND(v) {
      return Math.round(v).toLocaleString("vi-VN") + " đ";
    }

    function syncHolidayCheck() {
      markHolidayEl.checked = holidays.has(shiftDateEl.value);
    }
    shiftDateEl.addEventListener("change", syncHolidayCheck);
    syncHolidayCheck();

    document.getElementById("addHolidayBtn").addEventListener("click", () => {
      const v = newHolidayDateEl.value;
      if (!v) return;
      holidays.add(v);
      localStorage.setItem(KEY_HOLIDAYS, JSON.stringify(Array.from(holidays).sort()));
      syncHolidayCheck();
      renderAll();
    });

    function removeHoliday(dStr) {
      holidays.delete(dStr);
      localStorage.setItem(KEY_HOLIDAYS, JSON.stringify(Array.from(holidays).sort()));
      syncHolidayCheck();
      renderAll();
    }

    function renderHolidays() {
      const list = Array.from(holidays).sort();
      const box = document.getElementById("holidayChips");
      if (!list.length) {
        box.innerHTML = `<span class="muted">Chưa thêm ngày lễ riêng.</span>`;
        return;
      }
      box.innerHTML = list.map(d => `
        <span class="chip">Lễ ${d} (x2) <button type="button" onclick="removeHoliday('${d}')">&times;</button></span>
      `).join("");
    }

    document.getElementById("shiftForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const h = hoursBetween(startHourEl.value, endHourEl.value);
      if (h <= 0) return;

      if (markHolidayEl.checked) {
        holidays.add(shiftDateEl.value);
        localStorage.setItem(KEY_HOLIDAYS, JSON.stringify(Array.from(holidays).sort()));
      }

      shifts.push({
        id: Date.now().toString(),
        date: shiftDateEl.value,
        job: shiftJobEl.value,
        start: startHourEl.value,
        end: endHourEl.value,
        hours: h,
        holiday: markHolidayEl.checked
      });
      shifts.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      localStorage.setItem(KEY_SHIFTS, JSON.stringify(shifts));
      monthSelectEl.value = shiftDateEl.value.slice(0, 7);
      renderAll();
    });

    function deleteShift(id) {
      shifts = shifts.filter(s => s.id !== id);
      localStorage.setItem(KEY_SHIFTS, JSON.stringify(shifts));
      renderAll();
    }

    function populateWeeks() {
      const set = new Set([mondayOf(today)]);
      shifts.forEach(s => set.add(mondayOf(s.date)));
      const sorted = Array.from(set).sort((a, b) => b.localeCompare(a));
      const prev = weekSelectEl.value;
      weekSelectEl.innerHTML = sorted.map(m => `<option value="${m}">${m.slice(5)} – ${addDays(m, 6).slice(5)}</option>`).join("");
      weekSelectEl.value = (prev && sorted.includes(prev)) ? prev : sorted[0];
    }

    function renderWeek() {
      const mon = weekSelectEl.value;
      const sun = addDays(mon, 6);
      const dates = new Set(Array.from({ length: 7 }, (_, i) => addDays(mon, i)));
      document.getElementById("weekDesc").textContent = `Từ Thứ Hai (${mon}) đến Chủ Nhật (${sun}).`;

      const hoursByJob = {};
      JOBS.forEach(j => hoursByJob[j] = 0);

      shifts.forEach(s => {
        if (!JOBS.includes(s.job) || !dates.has(s.date)) return;
        hoursByJob[s.job] += effectiveHours(s);
      });

      let totalHours = 0, totalMoney = 0;
      let html = JOBS.map(j => {
        const h = hoursByJob[j];
        const money = h * (rates[j] || 0);
        totalHours += h;
        totalMoney += money;
        return `<tr>
          <td><span class="tag">${j}</span></td>
          <td><strong>${fmtH(h)}</strong></td>
          <td>${fmtVND(money)}</td>
        </tr>`;
      }).join("");

      html += `<tr class="sum-row">
        <td>Tổng tuần</td>
        <td>${fmtH(totalHours)}</td>
        <td>${fmtVND(totalMoney)}</td>
      </tr>`;
      document.getElementById("weekSummaryBody").innerHTML = html;
    }

    function renderMonth() {
      const m = monthSelectEl.value;
      const hoursByJob = {};
      JOBS.forEach(j => hoursByJob[j] = 0);

      shifts.forEach(s => {
        if (!s.date.startsWith(m) || !JOBS.includes(s.job)) return;
        hoursByJob[s.job] += effectiveHours(s);
      });

      let totalHours = 0, totalMoney = 0;
      let html = JOBS.map(j => {
        const h = hoursByJob[j];
        const money = h * (rates[j] || 0);
        totalHours += h;
        totalMoney += money;
        return `<tr>
          <td><span class="tag">${j}</span></td>
          <td><strong>${fmtH(h)}</strong></td>
          <td>${fmtVND(money)}</td>
        </tr>`;
      }).join("");

      html += `<tr class="sum-row">
        <td>Tổng tháng (${m})</td>
        <td>${fmtH(totalHours)}</td>
        <td>${fmtVND(totalMoney)}</td>
      </tr>`;
      document.getElementById("monthSummaryBody").innerHTML = html;
    }

    function renderLog() {
      const m = monthSelectEl.value;
      const jf = filterJobEl.value;
      const rows = shifts.filter(s => s.date.startsWith(m) && (jf === "ALL" || s.job === jf));

      if (!rows.length) {
        document.getElementById("logBody").innerHTML = `<tr><td colspan="7" class="muted">Chưa có ca nào trong tháng ${m}.</td></tr>`;
        return;
      }

      document.getElementById("logBody").innerHTML = rows.map(s => {
        const dbl = hasX2(s.date, s.holiday);
        const effH = effectiveHours(s);
        const money = effH * (rates[s.job] || 0);
        return `<tr>
          <td>${s.date.slice(5)}</td>
          <td>${dayName(s.date)}</td>
          <td><span class="tag">${s.job}</span></td>
          <td>${s.start}–${s.end}</td>
          <td><strong>${fmtH(effH)}</strong> ${dbl ? '<span class="tag tag-x2">x2</span>' : ''}</td>
          <td>${fmtVND(money)}</td>
          <td><button class="btn-del" onclick="deleteShift('${s.id}')">Xóa</button></td>
        </tr>`;
      }).join("");
    }

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      const m = monthSelectEl.value;
      const rows = [["Ngày", "Thứ", "Công việc", "Hệ số", "Bắt đầu", "Kết thúc", "Số giờ quy đổi", "Đơn giá", "Thành tiền"]];
      shifts.filter(s => s.date.startsWith(m)).forEach(s => {
        const u = rates[s.job] || 0;
        const dbl = hasX2(s.date, s.holiday);
        const effH = effectiveHours(s);
        rows.push([
          s.date, dayName(s.date), s.job, dbl ? "x2" : "x1", s.start, s.end, effH, u,
          Math.round(effH * u)
        ]);
      });
      const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `So_Cham_Cong_${m}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    weekSelectEl.addEventListener("change", renderWeek);
    monthSelectEl.addEventListener("change", () => { renderMonth(); renderLog(); });
    filterJobEl.addEventListener("change", renderLog);

    function renderAll() {
      renderHolidays();
      populateWeeks();
      renderWeek();
      renderMonth();
      renderLog();
    }

    renderAll();
  </script>
</body>
</html>
